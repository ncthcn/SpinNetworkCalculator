# Style checks (formatting + common mistakes like unused imports).
# continue-on-error: true means these steps REPORT problems in the Actions
# log but never turn the check red or block a merge. As of the September
# 2026 cleanup, black and flake8 are both clean — continue-on-error is kept
# for now so a future violation is visible but non-blocking; remove it to
# make this job an actual enforced gate.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: pip install black flake8

      - name: black --check (formatting; non-blocking)
        continue-on-error: true
        run: black --check --diff src/ scripts/ tests/

      - name: flake8 (style/bugs; non-blocking, see .flake8 for rules)
        continue-on-error: true
        run: flake8 src/ scripts/ tests/
