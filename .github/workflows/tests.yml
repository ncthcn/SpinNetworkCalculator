# CI: Continuous Integration
# Runs the pytest suite automatically on every push and pull request,
# so a broken reduction pipeline is caught before it reaches `main`.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run the whole job once per Python version below (a "build matrix").
      # If 3.10 fails but 3.11 passes, you see exactly which version broke.
      fail-fast: false
      matrix:
        # 3.9 dropped: networkx 3.3+/scipy 1.14+ no longer support it, so CI
        # resolved older deps than anything actually validated locally,
        # producing a false-positive failure unrelated to real code changes.
        python-version: ["3.10", "3.11"]

    steps:
      # 1. Clone the repo into the runner's temporary VM.
      - uses: actions/checkout@v5

      # 2. Install the Python version for this matrix slot.
      #    cache: pip re-uses downloaded packages between runs, so CI
      #    doesn't recompile pywigxjpf's C extension from scratch every time.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # No display exists on the runner; force matplotlib's non-GUI
          # backend so any plotting code imports without crashing.
          MPLBACKEND: Agg
        run: pytest tests/ -v
